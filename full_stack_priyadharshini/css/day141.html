<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        .grid-container{
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(4, 250px);
            grid-template-rows: repeat(3, 200px);
            grid-template-areas: 
            "grid1 fiit fiit grid3"
            "grid1 grid4 grid5 grid6"
            "grid1 grid7 grid8 grid6"
            ;

        }
        .grid1{
            grid-area:grid1;
            background-color: green;
        }
        .grid2{
            grid-area:fiit;
            background-color: greenyellow;
        }

        .grid3{
            grid-area: grid3;
            background-color: red;
        }
        .grid4{
            grid-area: grid4;
            background-color: yellow;
        }

        .grid5{
            grid-area: grid5;
            background-color: orange;
        }
        .grid6{
            grid-area: grid6;
            background-color: green;
        }

        .grid7{
            grid-area: grid7;
            background-color: violet;
        }
        .grid8{
            grid-area: grid8;
            background-color: brown;
        }
        

       
    </style>
</head>
<body>
    

    <div class="grid-container">
        <div class="grid1"></div>

        <div class="grid2"></div>

        <div class="grid3"></div>

        <div class="grid4"></div>

        <div class="grid5"></div>

        <div class="grid6"></div>

        <div class="grid7"></div>

        <div class="grid8"></div>
    </div>



</body>
</html>
