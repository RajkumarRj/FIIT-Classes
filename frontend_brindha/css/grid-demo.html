<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid-demo</title>
    <style>
      /* .container div { */
        /* width: 100px;
        height: 100px; */
        /* background-color: greenyellow; */
      /* } */
      .container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(3, 200px);
        gap: 10px;
      }
      .box1 {
        grid-row-start: 1;
        grid-row-end: 4;
        background-color: aqua;
      }
      .box2 {
        grid-column-start: 2;
        grid-column-end: 4;
        background-color: greenyellow;
      }
      .box3 {
        background-color: red;
      }
      .box4 {
        background-color: rebeccapurple;
      }
      .box5 {
        background-color: yellow;
      }
      .box6 {
        grid-row-start: 2;
        grid-row-end: 4;
        grid-column-start: 4;
        background-color: blue;
      }
      .box7 {
        background-color: brown;
      }
      .box8 {
        background-color: violet;
      }
    </style>
  </head>
  <body>
    <h1>Grid-demo</h1>

    <div class="container">
      <div class="box1"></div>
      <div class="box2"></div>
      <div class="box3"></div>
      <div class="box4"></div>
      <div class="box5"></div>
      <div class="box6"></div>
      <div class="box7"></div>
      <div class="box8"></div>
    </div>
  </body>
</html>
