<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex-grid</title>
    <style>
      .container {
        border: 2px solid;
        text-align: center;
        height: 500px;
        display: flex;
        justify-content: center;
        /* justify-content: space-evenly; */
        align-items: center;
        flex-wrap: wrap;
        /* gap: 20px; */
      }
      /* div>p {
        color: red;
      } */

      .container div {
        width: 100px;
        height: 100px;
        border: 2px solid black;
        background-color: burlywood;
        /* margin: 10px ; */
      }
      p {
        /* inline element => width & height ignore  */
        display: inline-block;
        width: 100px;
        height: 100px;
        background-color: yellow;
      }
      span {
        display: block;
        width: 100px;
        height: 100px;
        background-color: aqua;
      }
      h1{
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <h1>display none</h1>
    <h2>visibility hidden</h2>
    <p>block element</p>
    <span>inline element</span>
    <h2>inline-block element</h2>
    <h1>Flexbox</h1>
    <div class="container">
      <div>Box1</div>
    </div>
