<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API</title>
  </head>
  <body>
    <h1>API</h1>

    <button id="btn">Load users</button>
    <br /><br />

    <input type="text" id="search-input" placeholder="Enter name to search" />
    <ul id="users"></ul>

    <script>
      const lists = document.getElementById("users");
      const btn = document.getElementById("btn");
      const searchInput = document.getElementById("search-input");

      let allUser = [];

      async function fetchData() {
        try {
          const response = await fetch(
            "https://jsonplaceholder.typicode.com/users",
          );

          console.log(response);

          if (!response.ok) {
            throw new Error("Unable to load users");
          }

          allUser = await response.json();

          renderList(allUser);
        } catch (error) {
          console.log(error);
        }
      }

      function renderList(users) {

        lists.textContent= ""

        users.forEach((user) => {
          const item = document.createElement("li");

          item.textContent = user.name;

          lists.appendChild(item);
        });
      }

      searchInput.addEventListener("input", (e) => {
        const searchTerm = e.target.value.toLowerCase();


        const filteredUsers = allUser.filter((ele) =>
          ele.name.toLowerCase().includes(searchTerm),
        );


        renderList(filteredUsers);
      });

      btn.addEventListener("click", fetchData);

     
    </script>
  </body>
</html>
