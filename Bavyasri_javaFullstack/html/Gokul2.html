<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
  </head>
  <body>
    <h1>Forms</h1>

    <!-- void element (Self closing tag) -->

    <fieldset>
      <legend>Personal details</legend>

      <label for="name">Name : </label>
      <input id="name" type="text" placeholder="Enter your name.." />

      <br /><br />

      DOB: <input type="date" />

      <br /><br />

      <label>Gender : </label>
      Male <input type="radio" name="gender" /> Female
      <input type="radio" name="gender" />

      <br /><br />

      Email : <input type="email" placeholder="Enter your email" />

      <br /><br />
    </fieldset>

    <fieldset>
      <legend>Education Details</legend>

      <form action="">
        Degree :
        <select>
          <option selected disabled>select a value</option>
          <option value="">BCA</option>
          <option value="">BSC</option>
          <option value="">BCOM</option>
          <option value="">BA</option>
        </select>

        <br /><br />

        Mark : <input type="number" max="500" />

        <br /><br />

        Favourite Subject
        <br />
        <input type="checkbox" /> English
        <br />
        <input type="checkbox" /> Tamil
        <br />
        <input type="checkbox" /> Chemistry
        <br />

        Marksheet PDF: <input type="file" accept=".PDF" /> <br />
        <br />

        <textarea rows="5" cols="30"> </textarea>

        <br />

        <input type="submit" />
        <input type="reset" />
      </form>
    </fieldset>

    <!-- semantic vs non-semantic  -->

    <!-- website layout -->

    <!-- <b>BOLD</b>
    <strong>BOLD</strong> -->

    <header></header>

    <main>
      <aside></aside>

      <section></section>
      <section></section>
      <section></section>
    </main>

    <footer></footer>
    dflajdfla

   
  </body>
</html>
