      // function declaration

      //arrow function
      // Es6+
      let arrow = (a, b) => {
        console.log("Fiit function", a, b);
      };
      console.log(arrow);
      arrow(10, 20);

      // IIFE => immediate invoked function
      //anonymous function
      function data() {}

      data();

      (function (a, b) {
        console.log("Immediate invovked function ", a, b);
      })(10, 20);

      // closure => (lexical scope)
      // inner function remember outer function variable

      function outer() {
        let count = 10;

        return function inner() {
          count++;
          console.log(count);
        };
      }

      let result = outer();

      console.log(result);

      result();
      result();
      result();

      // callback function

      function greet(name, sayHello) {
        console.log(name);
        sayHello(thirdFunc);
      }

      function sayHello(callback2) {
        console.log("Welcome");
        callback2();
      }

      function thirdFunc() {
        console.log("third callback function ");
      }

      greet("Fiit", sayHello);
