    <script>
      console.log("Javascript ");

      // conditional statements, loops , jump statements

      // conditioal statement

      let age = 18;
      // // if
      // if(age  >= 18){
      //     console.log("You are eligible for vote");
      // }
      // nested if

      let voterid = true;

      if (age >= 18) {
        if (voterid) {
          console.log("You are eligible for vote");
        } else {
          console.log("You age is above 18 but you don't have voter id");
        }
      } else {
        console.log("your age is less than 18");
      }

      // if else
      // else if ladder =>
      let marks = 80;

      //   if (marks >= 90) {
      //     console.log("A grade");
      //   } else if (marks >= 80) {
      //     console.log("B grade");
      //   } else if (marks >= 70) {
      //     console.log("C grade");
      //   } else {
      //     console.log("Fail");
      //   }

      // switch

      switch (marks) {
        case 90:
          console.log("A grade");
          break;
        case 80:
          console.log("B grade");
          break;
        case 70:
          console.log("C grade");
          break;
        default:
          console.log("Fail");
          break;
      }

      //   while loop
      let j = 1;
      while (j <= 10) {
        console.log(j);
        j++;
      }
    </script>
