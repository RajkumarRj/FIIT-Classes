<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control structures</title>
  </head>
  <body>
    <h1 id="heading">Control structures</h1>

    <script>
      // control structures

      // conditional statments, loops

      let age = 18;

      if (age > 18) {
        console.log("Eligible to vote");
      } else {
        console.log("Not eligible to vote");
      }

      // else-if ladder

      let marks = 90;

      if (marks >= 90) {
        console.log("Grade A");
      } else if (marks >= 80) {
        console.log("Grade B");
      } else {
        console.log("Condition not met");
      }

      // switch

      switch (marks) {
        case 90:
          console.log("Grade A");
          break;

        case 80:
          console.log("Grade B");
          break;

        default:
          console.log("Condition not met");
          break;
      }

      // loops

      // for, while, do-while loop

      for (let i = 1; i <= 100; i++) {
        if (i % 2 != 0) {
          console.log(i);
        }
      }

      // while loop 

      let j =10;

      while(j > 0){
        console.log(j);
        j--;
      }

      // do-while loop
      let x= 10;

      do{
        console.log("do whlie ", x);
        x++;
        
      }while(x <= 20);


      for(let i=1; i<=10; i++){

        if(i == 5){
            // break;
            continue;
        }
        console.log("Break", i); 
        // alert(i);
      }

    //   DOM => document object model 

    const heading = document.getElementById("heading")

    heading.innerText = "FIIT";

    heading.style.backgroundColor = "blue"

    heading.style.color ="white";


    console.log(heading);
    



    //   alert("FIIT");
    </script>
  </body>
</html>
