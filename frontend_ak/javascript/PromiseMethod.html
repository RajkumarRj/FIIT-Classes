      async function fetchDatta() {
        return "Data fetched";
      }

      async function displayData() {
        const data = await fetchDatta();
        console.log(data);
      }

      displayData();

      let count = 0;
      const postContainer = document.getElementById("posts");

      async function jsonPlaceHoldeExample() {
        try {
          const result = await fetch(
            "https://jsonplaceholder.typicode.com/todos",
          );
          const data = await result.json();
          // postContainer.innerHTML = ` <h2>${data.id}</h2>
          // <h2>${data.title}</h2>`;
          data.slice(0, 10).forEach((ele) => {
            count++;
            const list = document.createElement("li");
            list.textContent = ele.title;

            if (!ele.completed) {
              list.style.textDecoration = "line-through";
            }
            postContainer.appendChild(list);
            // console.log(count);
          });
          //   console.log(result);
          //   console.log(data);
        } catch (error) {
          console.log(error);
        }
      }

      jsonPlaceHoldeExample();

      function fetchDetails() {
        return new Promise((resolve) => {
          setTimeout(() => {
            resolve(1);
          }, 2000);
        });
      }

      Promise.all([fetchDatta(), fetchDetails()]).then((res) =>
        console.log(res),
      );
