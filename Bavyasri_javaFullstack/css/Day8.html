<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project</title>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: black;
      }
      #container {
        background-color: #1c2b68;

        height: 100px;
        width: 300px;
        position: relative;
        margin-top: 200px;
      }
      #tooltip {
        background-color: #fff;
        width: fit-content;
        padding: 10px;
        position: absolute;
        right: 30px;
        top: -20px;
        border-radius: 10px;
      }
      #tooltip p {
        display: inline;
        font-weight: bolder;
        font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      }
      #tooltip span {
        font-size: 10px;
        color: gray;
        font-variant: small-caps;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="tooltip">
        <p>185</p>
        <span>gb left</span>
      </div>

      <i class="material-icons">more vert</i>
    </div>
  </body>
</html>
