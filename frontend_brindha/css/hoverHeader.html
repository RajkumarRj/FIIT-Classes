<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        header{
            background-color: #333;
            color: white;
        }

        ul li{
            display: inline-block;
            padding: 10px;
            cursor: pointer;
            position: relative;
        }
        .active{
            display: none;
            position:absolute;
            background-color: #5f5e5e;
            top: 100%;
            left: 0;
            margin: 0;
            padding: 0;
        }
       

        ul li:hover .active{
            display: block;
        }
    </style>
</head>
<body>
    <h1>Dropdown menu</h1>

    <header>
        <nav>
            <ul>
                <li>Product
                    <div class="active">
                        <ul>
                            <li>Mobile</li>
                            <li>Laptop</li>
                            <li>Computer</li>
                        </ul>
                    </div>
                </li>
                <li>Service
                    <div class="active">
                        <ul>
                            <li>mobile service</li>
                            <li>Laptop service</li>
                            <li>Computer service</li>
                        </ul>
                    </div>
                </li>
                <li>Contact us</li>
            </ul>
        </nav>
    </header>
</body>
</html>
