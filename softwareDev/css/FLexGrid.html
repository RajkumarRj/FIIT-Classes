<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex</title>

    <style>
      h1 {
        background-color: purple;
        width: 100px;
        height: 100px;
        border: 2px solid black;
      }
      span {
        background-color: orange;
        display: inline-block;
        width: 100px;
        height: 100px;
        border: 2px solid black;
      }

      /* inline -> ignores height and width  */
      /* }
      #container {
        display: flex;
        gap: 20px;
        border: 2px solid black;
        height: 400px;
        justify-content: center;
        align-items: center;
      } */

      #container {
        display: grid;
        grid-template-columns: repeat(3, 1fr)  ;
        grid-template-rows: repeat(3, 200px);
      }
      #container div {
        width: 100px;
        height: 100px;
        background-color: aqua;
        /* margin-bottom: 10px; */
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>

    <h1>Flex box</h1>
    <h2>Flex box</h2>
    <h3>Flex box</h3>

    <span>Inline element</span>
    <span>Inline element</span>
  </body>
</html>
