<!doctype html>

    <meta charset="UTF-8" />

    <title>Document</title>

  <body>
    <fieldset>
      <legend>Personal details</legend>

      <form action="./demo.html">
        <label for="username">Name:</label>
        <input
          id="username"
          type="text"
          required
          placeholder="Enter your name.."
        />

        <br /><br />

        <label for="useremail">Email</label>
        <input type="email" id="useremail" placeholder="Enter your  password" />

        <br /><br />

        <label for="">Password</label>
        <input type="password" placeholder="Enter your password..." />

        <br /><br />

        Male <input type="radio" name="gen" /> Female
        <input type="radio" name="gen" /> others
        <input type="radio" name="gen" />

        <br /><br />

        Java <input type="checkbox" /> HTML <input type="checkbox" />

        <br /><br />

        <input type="color" />
        <br /><br />

        <input type="date" />

        <br />
        <br />

        <input type="number" min="10" max="20" />

        <br /><br />

        <input type="file" />

        <br /><br />

        <input type="datetime-local" />

        <br /><br />

        <input type="range" min="1" max="5" />

        <input type="week" />
        <br /><br />

        <select>
          <optgroup label="Backend">
            <option value="">Java</option>
            <option value="">Spring boot</option>
            <option value="">Mysql</option>
          </optgroup>

          <optgroup label="Fronted">
            <option value="">Java</option>
            <option value="">HTML</option>
            <option value="">CSS</option>
            <option value="">Javascript</option>
            <option value="">Reactjs</option>
          </optgroup>
        </select>

        <br /><br />

        <textarea name="" id="" rows="10" cols="50"> </textarea>

        <br /><br />

        <input type="submit" />
        <input type="reset" />
      </form>
    </fieldset>

    <fieldset>
        <legend>Educational details</legend>

        <form action="">

            <input type="text">
        </form>
    </fieldset>
