<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
    <style>

        .para{
            color: red;

</head>
<body>
    <h1 id="first" >Document Object model</h1>

    <p class="para">item1</p>
    <p class="para">item2</p>

    <button id="btn">Click</button>


    <script>
        const button = document.getElementById("btn")

        //     alert("first button clicked")
        // } )

        //  button.addEventListener("dblclick" , ()=>{
        //     alert("second button clicked")
        // } )

        button.addEventListener("mouseover" , ()=>{
           button.style.color = "red"
           button.style.backgroundColor = "blue"
        } )

        button.addEventListener("mouseout" , ()=>{
           button.style.color = ""
           button.style.backgroundColor = ""
        } )

        const third = document.getElementsByTagName("p")

        console.log(third);

        console.log(second[0].innerText);
        console.log(second[1].innerText);

        

        const first = document.getElementById("first")

    
        // first.style.backgroundColor = "blue"

        first.style.padding = "10px"

        console.log(first.classList.contains("para"));
