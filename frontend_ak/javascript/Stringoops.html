<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strings</title>
</head>
<body>
    <h1>String</h1>

    <script>

        // mutable -> changeable 
        // immutable -> unchangeable
        // string -> immutable 

        let name = "Hello welcome";
        let college = 'VIT';

        let course = `LLB`; // template literal -> grave accent 


        let newKeyword = new String("Naren");

        let details = {name, college, course};

        console.log(details);
        

        console.log(name, college, course);
    

        document.writeln(name);


        // string methods 

        // document.writeln(name.length);
        console.log(name.length);

        console.log(name.indexOf('a'));

        console.log(name.lastIndexOf('a'));

        console.log(name.substring(3,0));

        // 3 => n-1 => 3-1 => 2

        console.log(name.slice(3,0));

        console.log(name.slice(-1));

        console.log(name.substring(-4));

        // chartat
        console.log(name.charAt(2));
        
        // replace
        console.log(name.replace("welcome", "FIIT"));

        // startswith

        console.log(name.startsWith("come"));
        
        // endswith

        console.log(name.endsWith("come"));
        
        // split

        console.log(name.split(" "));
    
        // lowercase
        console.log(name.toLowerCase());        
        // uppercase
        console.log(name.toUpperCase());
        // trim

        console.log("  hello welcome   ".trim());
        
        // includes 

        console.log(name.includes("e"));
        // class & objects -
        class Bank{

              balance =10;

              constructor(name, age, college){
                console.log(`
                Constructor is called-> 
                ${name} 
                ${age} 
                ${college}`);
              }

             display(){
                console.log("Bank class");  
             }
        }
        //inheritance 
        class Account extends Bank{
            constructor(){
                super();
                super.display();
                console.log("accounts class constructor is called");
                
            }
            //overriding
            display(){
                console.log("Account class");    
            }
        }
        let account = new Account();

        console.log(account.balance);
        account.display();
        
        let bank = new Bank("Maha", 20, "kasc");

        console.log(bank.balance);
        bank.display();
        
    </script>
    
</body>
</html>
