<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Theme Changer</title>
    <style>
        #card{
            width: 300px;
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #card img{
            width: 150px;
            margin-top: 20px;

        }
        .cardTheme{
            background-color: black;
            color: white;
        }
    </style>
  </head>
  <body>
    <div id="card">
      <img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTRM4AYB4vrbGWV-Rp2xSgGZSq2OrSBgNt0TSlcUoXFUnhTf-FN3tGsC30-&s=10"
        alt=""
      />
      

      <p>Photography</p>
      <button id="button">Toggle Theme</button>
    </div>

    <script>

         
        document.getElementById("button").onclick = ()=>{
            const container = document.getElementById("card");
            console.log("Button clicked");            
            // container.classList.add("cardTheme");
            // container.classList.remove("cardTheme");
            container.classList.toggle("cardTheme");
        }

    </script>
  </body>
</html>
