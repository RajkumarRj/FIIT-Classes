      //   objects

      // an object is a collection of key-value pairs

      let student = {
        name: "Sujay",
        age: 24,
        course: "Javascript",
        "college event": "Gravitas ",
        address: {
          street: "123",
        },
      };


      const {name, age, course}  = student;
      console.log(age);

    //   object methods 

    console.log(Object.keys(student));
    console.log(Object.values(student));

    // spread , rest operators 

    // spread

    let arr1 = [10,20,40]
    let arr2 = [...arr1, 30]

    console.log(arr2);

    let student1 = {
        name :"Sujay"
    }

    let student2 = {
        ...student1
    }

    console.log(student2);
    

    // rest

    console.log(a);
