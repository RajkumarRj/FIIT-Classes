<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="container">
      <div id="logo">
        <a href="index.html">
          <img src="https://static.vecteezy.com/system/resources/thumbnails/027/127/463/small_2x/javascript-logo-javascript-icon-transparent-free-png.png" alt="Logo" width="50" height="50" />
        </a>
      </div>
      <div class="logSign">
        <span id="user-info" style="color: #333; font-weight: bold;"></span>
        <a href="login.html" id="login-link">Log In</a>
        <a href="signup.html" id="signup-link">Sign Up</a>
        <a href="#" id="logout-btn" style="display: none;">Log Out</a>
      </div>
    </div>
  </header>

  <main class="store-layout">
    <section class="products-section">
      <a href="index.html" class="back-link">&larr; Back to Products</a>
      <div id="single-product-container"></div>
    </section>

    <aside class="cart-sidebar">
      <h2>Shopping Cart</h2>
      <ul id="cart-items"></ul>
      <div class="cart-summary">
          <strong>Total: $<span id="cart-total">0.00</span></strong>
      </div>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
